[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bullet-app"
version = "0.1.0"
description = "Standalone automatic SITL takeoff, hover and landing mission"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["beta-client", "click>=8.5,<9", "loguru>=0.7,<1", "pymavlink>=2.4.50,<3"]

[project.scripts]
bullet-app = "bullet_app.main:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv.sources]
beta-client = { path = "../beta_client", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
